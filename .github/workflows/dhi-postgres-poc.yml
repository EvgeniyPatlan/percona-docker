name: DHI PostgreSQL PoC

# Builds, tests and scans Percona Distribution for PostgreSQL 18 on Docker Hardened
# Images (DHI) Debian 13. The publish-ghcr job pushes the exact tested OCI image to ghcr.io only;
# nothing is ever pushed to Docker Hub.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline image to compare against
        required: false
        default: percona/percona-distribution-postgresql:18.6.1-4
        type: string
  push:
    branches:
      - dhi-postgres-poc
    paths:
      - 'dhi-common/**'
      - 'percona-distribution-postgresql-18-dhi/**'
      - '.github/workflows/dhi-postgres-poc.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.69.3
  GRYPE_VERSION: v0.116.1
  DEFAULT_BASELINE: percona/percona-distribution-postgresql:18.6.1-4

jobs:
  verify-base:
    name: Verify DHI base images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to pull from dhi.io"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to dhi.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify pinned base images
        run: |
          set -euo pipefail
          dockerfile=percona-distribution-postgresql-18-dhi/Dockerfile
          for arg in DHI_RUNTIME DHI_BUILDER; do
            ref="$(sed -n "s/^ARG ${arg}=//p" "$dockerfile")"
            if [ -z "$ref" ]; then
              echo "::error::ARG ${arg} not found in ${dockerfile}"
              exit 1
            fi
            echo "::group::verify-base ${arg} ${ref}"
            bash dhi-common/verify-base.sh "$ref"
            echo "::endgroup::"
          done

  build-test:
    name: Build, test and scan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standalone
            context: percona-distribution-postgresql-18-dhi
            image: percona-distribution-postgresql:18-dhi
            test_tag: percona/percona-distribution-postgresql:18-dhi
            trivyignore: percona-distribution-postgresql-18-dhi/.trivyignore
    outputs:
      amd64_digest: ${{ steps.load.outputs.amd64_digest }}
      amd64_config: ${{ steps.load.outputs.amd64_config }}
    steps:
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required to pull from dhi.io"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to dhi.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Add grype to PATH
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          set -euo pipefail
          dirname "$GRYPE_CMD" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          skopeo --version
          trivy --version
          grype version
          jq --version

      - name: Build multi-arch OCI image (no push)
        env:
          CONTEXT: ${{ matrix.context }}
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-context dhi-common=dhi-common \
            --sbom=true --provenance=mode=max \
            --label "org.opencontainers.image.source=https://github.com/${REPO}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            -t "$IMAGE" \
            --output "type=oci,dest=$RUNNER_TEMP/oci/${NAME}.tar" \
            "$CONTEXT"

      - name: Upload OCI image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.name }}
          path: ${{ runner.temp }}/oci/${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Load amd64 image from the OCI tar into the local daemon
        id: load
        env:
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          tar_path="$RUNNER_TEMP/oci/${NAME}.tar"
          # The DHI base layers are zstd-compressed, which skopeo cannot write into a docker-format
          # destination directly, so go through an uncompressed dir: copy of the amd64 image.
          amd64_dir="$RUNNER_TEMP/amd64-${NAME}"
          rm -rf "$amd64_dir"
          skopeo copy --override-arch amd64 --dest-decompress "oci-archive:${tar_path}" "dir:${amd64_dir}"
          # docker-archive + docker load instead of docker-daemon: skopeo's bundled docker client uses an
          # API version that newer Docker engines reject.
          skopeo copy "dir:${amd64_dir}" "docker-archive:${amd64_dir}.tar:${IMAGE}"
          docker load -i "${amd64_dir}.tar"
          rm -rf "$amd64_dir" "${amd64_dir}.tar"
          # amd64 manifest and its config digest, as recorded in the tar. --dest-decompress changes the
          # manifest (layer digests), but not the config, so the config digest ties the daemon image to the tar.
          amd64_digest="$(skopeo inspect --raw "oci-archive:${tar_path}" \
            | jq -r '[.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")][0].digest')"
          if [ -z "$amd64_digest" ] || [ "$amd64_digest" = "null" ]; then
            echo "::error::No linux/amd64 manifest in OCI tar"
            exit 1
          fi
          tar_config="$(tar -xOf "$tar_path" "blobs/sha256/${amd64_digest#sha256:}" | jq -r '.config.digest')"
          loaded_id="$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          if [ -z "$tar_config" ] || [ "$tar_config" = "null" ] || [ "$tar_config" != "$loaded_id" ]; then
            echo "::error::Loaded image ${loaded_id} does not match the tar's amd64 config ${tar_config}"
            exit 1
          fi
          {
            echo "amd64_digest=${amd64_digest}"
            echo "amd64_config=${tar_config}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Tested amd64 image: config \`${tar_config}\` (verified equal to the loaded image ID), manifest in OCI tar \`${amd64_digest}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test image
        env:
          IMAGE: ${{ matrix.image }}
        run: bash percona-distribution-postgresql-18-dhi/tests/test-image.sh "$IMAGE"

      - name: Test entrypoint
        env:
          IMAGE: ${{ matrix.image }}
        run: bash percona-distribution-postgresql-18-dhi/tests/test-entrypoint.sh "$IMAGE"

      - name: Run postgres-basics and postgres-initdb
        env:
          IMAGE: ${{ matrix.image }}
          TEST_TAG: ${{ matrix.test_tag }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE" "$TEST_TAG"
          bash test/run.sh -t postgres-basics -t postgres-initdb "$TEST_TAG"

      - name: Compare with baseline
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ matrix.image }}
          BASELINE: ${{ inputs.baseline || env.DEFAULT_BASELINE }}
          OUTDIR: ${{ runner.temp }}/compare-${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTDIR"
          docker pull "$BASELINE"
          bash dhi-common/compare.sh "$BASELINE" "$IMAGE" "$OUTDIR"
          cat "$OUTDIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-${{ matrix.name }}
          path: ${{ runner.temp }}/compare-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14

      - name: Gate on CRITICAL fixable vulnerabilities
        if: ${{ !cancelled() }}
        env:
          IMAGE: ${{ matrix.image }}
          TRIVYIGNORE: ${{ matrix.trivyignore }}
        run: |
          set -euo pipefail
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile "$TRIVYIGNORE" "$IMAGE"

  publish-ghcr:
    name: Publish to GHCR
    needs: [verify-base, build-test]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested OCI image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-standalone
          path: ${{ runner.temp }}/oci

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show skopeo version
        run: skopeo --version

      - name: Push the tested OCI image to ghcr.io
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          TESTED_AMD64: ${{ needs.build-test.outputs.amd64_digest }}
          TESTED_CONFIG: ${{ needs.build-test.outputs.amd64_config }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${owner}/percona-distribution-postgresql"
          short_sha="${SHA:0:7}"
          tar_path="$RUNNER_TEMP/oci/standalone.tar"
          index_digest="$(skopeo inspect --raw "oci-archive:${tar_path}" | sha256sum | cut -d' ' -f1)"
          index_digest="sha256:${index_digest}"
          for tag in 18-dhi "18-dhi-${short_sha}"; do
            skopeo copy --all "oci-archive:${tar_path}" "docker://${image_name}:${tag}"
          done
          pushed="$(skopeo inspect --raw "docker://${image_name}:18-dhi" | sha256sum | cut -d' ' -f1)"
          pushed="sha256:${pushed}"
          if [ "$pushed" != "$index_digest" ]; then
            echo "::error::Pushed index digest ${pushed} differs from the tar's ${index_digest}"
            exit 1
          fi
          {
            echo "### Published image"
            echo
            echo "- Index digest: \`${pushed}\` (same OCI index that build-test produced)"
            echo "- Tested amd64 manifest in the tar (build-test): \`${TESTED_AMD64}\`, config \`${TESTED_CONFIG}\`"
            echo "- Tags: \`18-dhi\`, \`18-dhi-${short_sha}\`"
            echo "- Source: https://github.com/${REPO}"
            echo
            echo '```'
            echo "docker pull ${image_name}@${pushed}"
            echo "docker pull ${image_name}:18-dhi"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
